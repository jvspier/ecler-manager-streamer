<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Ecler VEO Manager</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #99a1b3; --accent: #4c8dff; --bad: #ef5d5d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6fa; --panel:#fff; --panel-2:#f0f2f7; --line:#dde1ea;
            --text:#161a22; --muted:#5d6577; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  form {
    width: 100%; max-width: 340px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 26px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; font-weight: 650; }
  p.sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 5px; }
  input {
    width: 100%; font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; font: inherit; font-weight: 550;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 8px; padding: 10px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    margin: 16px 0 0; padding: 9px 11px; border-radius: 8px; font-size: 12.5px;
    border: 1px solid var(--bad); color: var(--bad);
  }
  .note { margin: 18px 0 0; font-size: 11.5px; color: var(--muted); }
  .note code { font-family: var(--mono); }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Ecler VEO Manager</h1>
  <p class="sub">Sign in to view and switch the TV channels.</p>

  <div id="error" hidden class="error"></div>

  <label for="user">Service account</label>
  <input id="user" name="user" autocomplete="username" required autofocus
         spellcheck="false">

  <label for="password">Password</label>
  <input id="password" name="password" type="password"
         autocomplete="current-password" required>

  <button type="submit">Sign in</button>

  <p class="note">Served over plain HTTP on the local network, so treat this as
  a lock on the door rather than a secure channel.</p>
</form>

<script>
  const params = new URLSearchParams(location.search);
  const error = params.get("error");
  if (error) {
    const box = document.getElementById("error");
    box.textContent = error === "throttled"
      ? "Too many failed attempts. Wait a few minutes and try again."
      : "Wrong account or password.";
    box.hidden = false;
  }
</script>
</body>
</html>
